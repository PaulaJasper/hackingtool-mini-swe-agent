name: checks
# The gate. Runs the exact same script as the local pre-push hook, so a green
# push means a green CI. Runs on every branch + PR (not just master).
on:
  push:
  pull_request:

jobs:
  checks:
    name: Run shared checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
      - name: Run shared check script
        run: ./scripts/check.sh
